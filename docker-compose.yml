
name: project-ops-agent
x-tool-server: &tool-server
  build: .
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &tool-env
    # Two roles, two DSNs, the replica boundary.
    DATABASE_URL: postgresql://agent_app:${AGENT_APP_PASSWORD}@postgres:5432/projectops
    DATABASE_URL_RO: postgresql://agent_replica:${AGENT_REPLICA_PASSWORD}@postgres:5432/projectops
    # Each tool server validates the agent's credential itself.
    AGENT_JWT_SECRET: ${AGENT_JWT_SECRET}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectops
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by 02-roles.sql when the cluster first initializes.
      AGENT_APP_PASSWORD: ${AGENT_APP_PASSWORD}
      AGENT_REPLICA_PASSWORD: ${AGENT_REPLICA_PASSWORD}
    # Runs 01-schema-and-seed.sql then 02-roles.sql on first init, in order.
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d projectops"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The model gateway. Budget caps live here, not in application code, so the
  # gateway-enforced termination is a real mechanism.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_BASE_URL}
      # Ollama runs on the host, not in Compose.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ollama_chat/llama3.1:8b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["4000:4000"]

  # The orchestrator. 
  orchestrator:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "ai-agents-webinar", "--ui"]
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
      sprint:
        condition: service_started
      warehouse:
        condition: service_started
      http:
        condition: service_started
      fs:
        condition: service_started
    environment:
      <<: *tool-env
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/projectops
      # Tool servers are addressed by Compose service name.
      MCP_URL_SPRINT: http://sprint:8101/mcp
      MCP_URL_WAREHOUSE: http://warehouse:8102/mcp
      MCP_URL_HTTP: http://http:8103/mcp
      MCP_URL_FS: http://fs:8104/mcp
      # The gateway is the only route to a model. No provider key here.
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      # Failover target when the hosted gateway is unreachable. Never used for a
      # budget refusal — that is the gateway deciding, not failing.
      MODEL_FALLBACK: ${MODEL_FALLBACK:-local}
      # Observability and the approval channel.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      SLACK_APPROVAL_CHANNEL: ${SLACK_APPROVAL_CHANNEL}
      # Third-party kanban layer.
      UMAKU_MCP: ${UMAKU_MCP}
      UI_PORT: 8080
    ports:
      # The display is meant to be opened from a phone or a second screen. Published to the host.
      - "8080:8080"

  sprint:
    <<: *tool-server
    command: ["python", "-m", "ai_agents_webinar.servers", "sprint"]
    environment:
      <<: *tool-env
      MCP_PORT: 8101
    ports: ["8101:8101"]

  warehouse:
    <<: *tool-server
    command: ["python", "-m", "ai_agents_webinar.servers", "warehouse"]
    environment:
      <<: *tool-env
      MCP_PORT: 8102
    ports: ["8102:8102"]

  http:
    <<: *tool-server
    command: ["python", "-m", "ai_agents_webinar.servers", "http"]
    environment:
      <<: *tool-env
      MCP_PORT: 8103
    ports: ["8103:8103"]

  fs:
    <<: *tool-server
    command: ["python", "-m", "ai_agents_webinar.servers", "fs"]
    environment:
      <<: *tool-env
      MCP_PORT: 8104
    ports: ["8104:8104"]

volumes:
  pgdata:
